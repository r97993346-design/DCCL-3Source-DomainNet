# Default update config
# Config order: hparams_registry -> config.yaml -> CLI

swad: LossValley
swad_kwargs:
  n_converge: 3
  n_tolerance: 6
  tolerance_ratio: 0.3
test_batchsize: 128

indomain_test: False  # use indomain test split or not

# Pure CIPT reproduction switch.
# true  -> original CIPT objective only
# false -> original CIPT + direct single-view causal SupCon
cipt_pure: false

# Single-view contrastive ablation (C experiment).
# true -> training data returns only the official CLIP-preprocessed x view;
#         there is no augmented x_2 view. Positives are other same-class
#         samples in the minibatch. Anchors without a same-class peer are
#         skipped by the contrastive loss.
cipt_single_view_contrastive: true

# Direct causal contrastive coefficient. No projection head is used.
cipt_causal_contrastive_weight: 0.1

# Linear warmup for the effective contrastive coefficient:
# lambda_eff = lambda_max * min(1, step / warmup_steps)
cipt_contrastive_warmup_steps: 500

# Training preprocessing in this branch:
# x = official CLIP Resize + CenterCrop + RGB + normalization
# No RandomResizedCrop/flip/ColorJitter/grayscale contrastive view is generated.

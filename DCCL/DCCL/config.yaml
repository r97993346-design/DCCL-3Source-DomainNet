# Default update config
# Config order: hparams_registry -> config.yaml -> CLI

swad: LossValley
swad_kwargs:
  n_converge: 3
  n_tolerance: 6
  tolerance_ratio: 0.3
test_batchsize: 128

indomain_test: False  # use indomain test split or not

# Pure CIPT reproduction switch:
# - one original/basic image only
# - no DCCL contrastive, pre-CL, or representation regularizer
# All prompt/TDA/optimizer/SWAD logic stays unchanged.
cipt_pure: false

# Fusion-only causal consistency between original and augmented causal features.
cipt_causal_consistency_weight: 1.0

# CIPTDCCL fusion uses a fixed two-view pipeline:
# x   = official CLIP Resize + CenterCrop + normalization
# x_2 = RandomResizedCrop + flip + ColorJitter + grayscale + CLIP normalization

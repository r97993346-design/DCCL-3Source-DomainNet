# Default update config
# Config order: hparams_registry -> config.yaml -> CLI

swad: LossValley
swad_kwargs:
  n_converge: 3
  n_tolerance: 6
  tolerance_ratio: 0.3
test_batchsize: 128

indomain_test: False  # use indomain test split or not

# Minimal visual-prompt experiment.
# true  -> only original CIPT objective: L_cls + beta*L_de + gamma*L_ind
# false -> inherited direct causal-space SupCon is additionally enabled.
# Keep true for the clean "visual tokens learned only by causal/task losses" run.
cipt_pure: true

# Shallow visual prompt P_v. CLIP-V remains fully frozen; there is no dedicated
# visual-prompt loss. Gradients from the existing downstream losses pass through
# the frozen transformer and update only the prompt tokens and existing adapters.
cipt_visual_prompt_enabled: true
cipt_visual_prompt_length: 4

# Inherited direct causal contrastive ablation. These settings matter only when
# cipt_pure=false. There is no projection head, pre-CL, or representation reg.
cipt_causal_contrastive_weight: 0.1
cipt_contrastive_warmup_steps: 500

# cipt_pure=false uses the inherited fixed two-view pipeline:
# x   = official CLIP Resize + CenterCrop + normalization
# x_2 = RandomResizedCrop + flip + ColorJitter + grayscale + CLIP normalization

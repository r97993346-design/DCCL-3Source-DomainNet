# Default update config
# Config order: hparams_registry -> config.yaml -> CLI

swad: null
swad_kwargs:
  n_converge: 3
  n_tolerance: 6
  tolerance_ratio: 0.3
test_batchsize: 128

indomain_test: False  # use indomain test split or not

# Pure CIPT reproduction switch.
# true  -> public-CIPT-aligned objective only
# false -> the same CIPT objective + single-view causal-space SupCon
cipt_pure: false

# This branch intentionally removes the augmented image branch.
# Training data returns only x with the official CLIP Resize + CenterCrop +
# RGB + tensor + CLIP normalization pipeline. No x_2/e_aug is constructed.
cipt_use_aug_view: false

# Direct single-view causal contrastive coefficient.
# Positives are other original causal features in the merged source-domain batch
# with the same class label; self-pairs are excluded.
cipt_causal_contrastive_weight: 0.1

# Linear warmup for the effective contrastive coefficient:
# lambda_eff = lambda_max * min(1, step / warmup_steps)
cipt_contrastive_warmup_steps: 500

# Causal decomposition is aligned to the public CIPT implementation:
# 1) frozen CLIP visual feature -> L2 normalization before decomposition
# 2) causal/spurious linear adapters -> identity weight + zero bias init
# Contrastive learning remains projection-free and uses only original e.

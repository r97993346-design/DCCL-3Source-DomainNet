# Default update config
# Config order: hparams_registry -> config.yaml -> CLI

# This ablation branch evaluates the full training trajectory with IID model
# selection. SWAD is disabled by default so LossValley cannot terminate the
# optimization early. After all requested steps finish, trainer.py reports:
# - iid: checkpoint selected by the best source-domain validation accuracy
#        (train_out), evaluated on the held-out target domain (test_in)
# - last: the final checkpoint after the full training schedule
swad: null
swad_kwargs:
  n_converge: 3
  n_tolerance: 6
  tolerance_ratio: 0.3
test_batchsize: 128

indomain_test: False  # use indomain test split or not

# CIPT class-SupCon ablation branch.
# Pure CIPT baseline switch:
# - true: original/basic image only, no contrastive objective
# - false: allow the class-SupCon switch below
cipt_pure: false

# Main experiment on this branch:
# - one original CLIP-preprocessed image per sample
# - positives are different samples with the same class label
# - no x_2 / image-augmentation positives
# - no pretrained-feature anchoring (pre-CL)
# - no representation/Gaussian anchoring regularizer
# - no causal-consistency or augmented L_de
cipt_class_supcon: true

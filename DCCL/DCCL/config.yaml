# Default update config
# Config order: hparams_registry -> config.yaml -> CLI

swad: LossValley
swad_kwargs:
  n_converge: 3
  n_tolerance: 6
  tolerance_ratio: 0.3
test_batchsize: 128

indomain_test: False  # use indomain test split or not

# Pure CIPT reproduction switch.
# true  -> original CIPT objective only
# false -> original CIPT + direct causal-space SupCon with one augmented view
cipt_pure: false

# Direct causal contrastive ablation.
# There is no projection head and no augmented-view classification/decomposition
# loss. x_2 is causally decomposed only to provide e_aug as the positive view.
# Because the contrastive gradient now acts directly on the causal representation,
# start substantially below the old projection-head weight of 1.0.
cipt_contrastive_weight: 0.1

# Linear warmup for the effective contrastive coefficient:
# lambda_eff = lambda_max * min(1, step / warmup_steps)
cipt_contrastive_warmup_steps: 500

# CIPTDCCL fusion uses a fixed two-view pipeline:
# x   = official CLIP Resize + CenterCrop + normalization
# x_2 = RandomResizedCrop + flip + ColorJitter + grayscale + CLIP normalization

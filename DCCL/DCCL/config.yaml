# Default update config
# Config order: hparams_registry -> config.yaml -> CLI

swad: LossValley
swad_kwargs:
  n_converge: 3
  n_tolerance: 6
  tolerance_ratio: 0.3
test_batchsize: 128

indomain_test: False  # use indomain test split or not

# Optional PCL auxiliary alignment for DCCL.
# Disabled by default so DCCL follows the original baseline path exactly.
use_pcl: False
pcl_weight: 0.1
pcl_align_weight: 1.0
pcl_uniform_weight: 0.1
pcl_transport_mass: 0.8
pcl_sinkhorn_epsilon: 0.05
pcl_sinkhorn_iters: 50
pcl_uniform_temperature: 2.0
pcl_match_threshold: 0.5

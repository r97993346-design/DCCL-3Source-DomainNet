# Default update config
# Config order: hparams_registry -> config.yaml -> CLI

swad: LossValley
swad_kwargs:
  n_converge: 3
  n_tolerance: 6
  tolerance_ratio: 0.3
test_batchsize: 128

indomain_test: False  # use indomain test split or not
use_fourier_intervention: False
use_intervention_reliability: False
fourier_mix_alpha: 0.5
fourier_mix_min: 0.1
fourier_mix_max: 0.9
fourier_donor_cross_domain_only: True
intervention_mu: 0.0
intervention_temperature: 0.1
reliability_min_weight: 0.05
reliability_loss_weight: 1.0
detach_reliability_score: True
log_intervention_stats: True
use_factorization_loss: False
factorization_loss_weight: 0.01
factorization_offdiag_weight: 0.005
factorization_eps: 0.0001
factorization_feature_source: contrastive
log_factorization_stats: True
use_adversarial_masker: False
masker_aux_loss_weight: 0.1
masker_adversarial_weight: 1.0
mask_keep_ratio: 0.5
gumbel_temperature: 1.0
gumbel_hard: True
masker_hidden_dim: 256
masker_update_interval: 1
log_masker_stats: True

# RISE-guided semantic supervision defaults (all disabled unless requested).
use_rise: False
use_rise_kd: False
use_rise_proto: False
rise_clip_model_name: ViT-B/32
rise_clip_download_root: null
rise_kd_weight: 0.5
rise_proto_weight: 0.1
rise_kd_temperature: 2.0
rise_prompt_mode: rise80
rise_freeze_clip: True
rise_projection_dim: 512

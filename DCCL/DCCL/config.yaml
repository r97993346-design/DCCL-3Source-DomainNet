# Default update config
# Config order: hparams_registry -> config.yaml -> CLI

swad: LossValley
swad_kwargs:
  n_converge: 3
  n_tolerance: 6
  tolerance_ratio: 0.3
test_batchsize: 128

indomain_test: False  # use indomain test split or not
use_intervention_reliability: False
fourier_mix_alpha: 0.5
fourier_mix_min: 0.1
fourier_mix_max: 0.9
fourier_donor_cross_domain_only: True
intervention_mu: 0.0
intervention_temperature: 0.1
reliability_min_weight: 0.05
reliability_loss_weight: 1.0
detach_reliability_score: True
log_intervention_stats: True

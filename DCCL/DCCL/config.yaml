# Default update config
# Config order: hparams_registry -> config.yaml -> CLI

swad: null
swad_kwargs:
  n_converge: 3
  n_tolerance: 6
  tolerance_ratio: 0.3
test_batchsize: 128

indomain_test: False  # use indomain test split or not

# Legacy compatibility switch.
# true forces the added causal contrastive objective off.
# For the progressive ablation table below, keep this false and use the
# explicit module switches.
cipt_pure: false

# Progressive paper-level module ablations.
# Valid configurations are intentionally hierarchical:
#   Base:                 false, false, false
#   + Causal:             true,  false, false
#   + Text Diversity:     true,  true,  false
#   + Contrastive (Full): true,  true,  true
# Text Diversity uses the existing Safe-Diverse selector + TDA implementation
# unchanged. Contrastive is the existing single-view SupCon objective on e.
cipt_use_causal_module: true
cipt_use_text_diversity: true
cipt_use_contrastive_module: true

# This branch intentionally removes the augmented image branch.
# Training data returns only x; no x_2/e_aug contrastive path is constructed.
cipt_use_aug_view: false

# Direct single-view causal contrastive coefficient.
# Positives are other original causal features in the merged source-domain batch
# with the same class label; self-pairs are excluded.
cipt_causal_contrastive_weight: 0.1

# Linear warmup for the effective contrastive coefficient:
# lambda_eff = lambda_max * min(1, step / warmup_steps)
cipt_contrastive_warmup_steps: 500

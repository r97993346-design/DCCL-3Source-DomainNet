# Default update config
# Config order: hparams_registry -> config.yaml -> CLI

swad: null
swad_kwargs:
  n_converge: 3
  n_tolerance: 6
  tolerance_ratio: 0.3
test_batchsize: 128

indomain_test: False  # use indomain test split or not

# Legacy pure-CIPT compatibility switch.
# true forces the added causal contrastive objective off.
# For new ablations, prefer the four explicit switches below.
cipt_pure: false

# Independent component-ablation switches.
# They can be overridden from the command line, e.g.
#   --cipt_use_de false --cipt_use_ind true
#   --cipt_use_tda false --cipt_use_contrastive false
cipt_use_de: true
cipt_use_ind: true
cipt_use_tda: true
cipt_use_contrastive: true

# This branch intentionally removes the augmented image branch.
# Training data returns only x with the official CLIP Resize + CenterCrop +
# RGB + tensor + CLIP normalization pipeline. No x_2/e_aug is constructed.
cipt_use_aug_view: false

# Direct single-view causal contrastive coefficient.
# Positives are other original causal features in the merged source-domain batch
# with the same class label; self-pairs are excluded.
cipt_causal_contrastive_weight: 0.1

# Reference-weighted contrastive learning on original e only.
# intervention: fraction of the existing K TDA predictions that match the label
# confidence: correct-class probability of the pre-TDA e prediction (control)
# uniform: original single-view supervised contrastive objective (control)
# These are hparams, overridable through sconf CLI, e.g.
#   --cipt_contrastive_reference uniform
cipt_contrastive_reference: intervention

# Positive-reference weight = floor + (1-floor) * detached reliability.
# Weights are normalized over each anchor's same-class, non-self references.
# Anchors are NOT reliability-weighted. TDA off -> uniform references, logged.
cipt_contrastive_reference_floor: 0.1

# Linear warmup for the effective contrastive coefficient:
# lambda_eff = lambda_max * min(1, step / warmup_steps)
cipt_contrastive_warmup_steps: 500

# Causal decomposition is aligned to the public CIPT implementation:
# 1) frozen CLIP visual feature -> L2 normalization before decomposition
# 2) causal/spurious linear adapters -> identity weight + zero bias init
# Contrastive learning remains projection-free and uses only original e.

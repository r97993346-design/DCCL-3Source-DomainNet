optimizer: sgd
lr: 0.003
weight_decay: 0.0
sgd_momentum: 0.9
swad: null
batch_size: 32
aug: 0.0
indomain_test: false
cipt_lr_schedule: constant
cipt_clip_backbone: ViT-B/16
cipt_objective: env_anchor
cipt_template_mode: b5b
cipt_class_text_mode: learnable
cipt_env_selection: all
cipt_env_topk: 80
cipt_env_constraint: relative_distance
cipt_rd_anchor_mode: full
cipt_env_loss_weight: 1.5
cipt_env_inference: e_only
cipt_e_cls_weight: 1.0
cipt_s_uniform_weight: 1.0
cipt_gamma: 0.1
cipt_use_ind: true
cipt_use_de: true
cipt_use_tda: false
cipt_pure: false
cipt_use_aug_view: false
cipt_env_kl_weight: 0.0
cipt_fused_cls_weight: 0.0
cipt_use_contrastive: true
cipt_contrastive_type: clip_guided_cross_domain
cipt_causal_contrastive_weight: 0.1
cipt_clip_teacher_mix: 0.25
cipt_clip_teacher_temperature: 0.2
cipt_contrastive_temperature: 0.1
cipt_contrastive_warmup_steps: 0

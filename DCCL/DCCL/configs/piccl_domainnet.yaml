# Recommended PICCL config for three-source DomainNet runs.
piccl_rank: 16
piccl_beta_max: 0.20
piccl_isr_weight: 0.03
use_piccl: true
piccl_use_causal_reliability: false
piccl_reliability_min: 0.2
piccl_reliability_warmup_ratio: 0.1
piccl_reliability_ramp_ratio: 0.2
piccl_reliability_detach: true
piccl_reliability_cross_domain_only: true

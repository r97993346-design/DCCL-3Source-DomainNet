# Recommended PICCL config for three-source DomainNet runs.
# Backbone features are passed through mediator + residual gate before the
# original DCCL losses; only ISR and orthogonality are added as causal losses.
piccl_rank: 16
piccl_alpha_max: 0.5
piccl_proto_momentum: 0.99
piccl_isr_weight: 0.1
piccl_orth_weight: 0.001
piccl_eps: 1.0e-8
piccl_basis_receive_task_grad: false
piccl_min_valid_domains: 2
piccl_lr_multiplier: 1.0
piccl_residual_scale: 0.1
piccl_gate_bias: -4.0
use_piccl: true
piccl_strict_bypass: false

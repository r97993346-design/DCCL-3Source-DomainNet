# Frozen 80-template classifier prototypes + all-80 relative-distance regularizer.
# Separate switches:
# - cipt_class_text_mode=fixed80: replace trainable CoOp class prompts for E/S CE
#   and E-only inference with normalized mean of all 80 frozen class text vectors.
# - cipt_env_selection=all: keep original all-80 RD template relationships.
# - cipt_rd_anchor_mode=full: use 80-template normalized center for RD teacher.
# Defaults match the existing PACS E1/S1/RD1 ablation except class text branch.
cipt_objective: env_anchor
cipt_env_constraint: relative_distance
cipt_class_text_mode: fixed80
cipt_template_mode: b5b
cipt_selector_mode: random   # inherited constructor; not actual selection
cipt_env_selection: all
cipt_env_topk: 80
cipt_env_loss_weight: 1.0
cipt_rd_anchor_mode: full
cipt_env_inference: e_only
cipt_use_tda: false
cipt_env_kl_weight: 0.0
cipt_fused_cls_weight: 0.0
cipt_use_de: true
cipt_beta: 1.0
cipt_e_cls_weight: 1.0
cipt_s_uniform_weight: 1.0
cipt_use_ind: false
cipt_gamma: 0.0
cipt_use_contrastive: false
cipt_causal_contrastive_weight: 0.0
cipt_pure: false
cipt_use_aug_view: false
lr: 5.0e-5
swad: LossValley

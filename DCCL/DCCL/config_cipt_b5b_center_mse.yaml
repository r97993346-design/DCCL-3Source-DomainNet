# E-to-official-text-class-center alignment, selectable text templates.
# cipt_env_selection=entropy: per-image frozen-CLIP lowest-entropy top N.
#   Recompute each image's center from its N selected class-specific vectors.
# cipt_env_selection=all: bypass entropy, use all 80 official templates.
# Optional cipt_env_selection=random: N uniformly random templates/image.
# Example override (no entropy): --cipt_env_selection all --cipt_env_topk 80
cipt_objective: env_anchor
cipt_env_constraint: center_mse
cipt_template_mode: b5b
cipt_selector_mode: random # inherited constructor; unrelated to entropy
cipt_env_selection: entropy
cipt_env_topk: 40
cipt_env_loss_weight: 1.0
cipt_rd_anchor_mode: full # only relevant for relative_distance, not center_mse
cipt_env_inference: e_only
cipt_use_tda: false
cipt_env_kl_weight: 0.0
cipt_fused_cls_weight: 0.0

cipt_use_de: true
cipt_e_cls_weight: 1.0
cipt_s_uniform_weight: 1.0
cipt_use_ind: false
cipt_use_contrastive: false
cipt_pure: false
cipt_use_aug_view: false
lr: 5.0e-5
swad: LossValley

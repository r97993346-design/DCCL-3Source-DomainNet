# Load after config.yaml. Opt-in preset; existing YAMLs are unchanged.
# total = E_CE + S_uniform + lambda_con * cross_domain_contrastive
cipt_objective: env_kl
cipt_enabled: true
cipt_clip_backbone: ViT-B/16
cipt_use_de: true
cipt_e_cls_weight: 1.0
cipt_s_uniform_weight: 1.0
cipt_use_ind: false
cipt_gamma: 0.0
cipt_use_tda: false
cipt_fusion_mode: tda
cipt_env_kl_weight: 0.0
cipt_fused_cls_weight: 0.0
# env_anchor options are inactive in env_kl; disable them explicitly as well.
cipt_env_constraint: none
cipt_env_loss_weight: 0.0
cipt_env_inference: e_only
cipt_use_aug_view: false
cipt_template_mode: b5b
cipt_selector_mode: random
cipt_prompt_length: 16
cipt_prompt_init: a photo of a

cipt_pure: false
cipt_use_contrastive: true
cipt_contrastive_type: clip_guided_cross_domain
cipt_contrastive_temperature: 0.1
cipt_causal_contrastive_weight: 1.0
cipt_contrastive_warmup_steps: 0
cipt_clip_teacher_temperature: 0.2
cipt_clip_teacher_mix: 0.5
cipt_clip_teacher_topk: 0
cipt_neighbor_diagnostics: false

lr: 5.0e-5
batch_size: 32
weight_decay: 0.0
swad: LossValley

name: Consistent CIPT TDA regression tests
on:
  push:
    branches:
      - repro/cipt-tda-consistent-domainbed
  workflow_dispatch:

jobs:
  cpu-functional-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch (no CLIP checkpoint needed)
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Compile and run candidate-scoring tests
        working-directory: DCCL/DCCL
        run: |
          python -m py_compile cipt_tda_consistent.py train_cipt_tda_consistent_domainbed.py
          python -m unittest discover -s tests -p "test_cipt_tda_consistent.py" -v

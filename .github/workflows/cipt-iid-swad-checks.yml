name: CIPT source-only IID and SWAD
on:
  push:
    branches:
      - feature/cipt-tda-domainbed-iid-swad
  workflow_dispatch:

jobs:
  cpu-functional-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy
      - name: Verify selection and original implementation
        working-directory: DCCL/DCCL
        run: |
          python -m py_compile cipt_iid_swad.py train_cipt_tda_iid_swad_domainbed.py
          python -m unittest discover -s tests -p 'test_cipt_iid_swad.py' -v
          python -m unittest discover -s tests -p 'test_cipt_tda_consistent.py' -v
          python -m unittest discover -s tests -p 'test_cipt_official_domainbed.py' -v
